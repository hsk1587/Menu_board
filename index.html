<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브릿지 커피 메뉴판</title>

  <script>
    /* ################################################################
       ##                                                            ##
       ##   ★★★  메뉴 정보는 전부 여기 한곳에 모여 있습니다  ★★★    ##
       ##   (메뉴 추가 · 삭제 · 가격 수정은 이 칸 안에서만 하세요)   ##
       ##                                                            ##
       ################################################################

       ■ 먼저 알아두세요
         - 이 파일은 "메모장"으로도 열 수 있어요. (파일을 오른쪽 클릭 → 연결 프로그램 → 메모장)
           수정한 뒤에는 꼭 저장(Ctrl + S)하고, 브라우저에서 새로고침(F5)하면 바뀐 모습이 보여요.
         - 수정하기 전에 파일을 복사해서 "index_백업.html" 같은 이름으로 하나 더 저장해 두면
           실수해도 안전해요.
         - 아래 규칙만 지키면 절대 망가지지 않아요:
             1) 글자는 반드시 큰따옴표 " " 안에 쓰기
             2) 메뉴 한 줄이 끝나면 맨 끝에 쉼표(,) 붙이기 (맨 마지막 메뉴만 쉼표 없음)
             3) 중괄호 { } 와 콜론(:) 지우지 않기
             4) 줄 맨 앞에 // 가 붙은 줄은 "설명글"이라서 화면에 나오지 않아요


       ■ 메뉴 한 줄은 이렇게 생겼어요
         { 종류: "커피", 이름: "아메리카노", 가격: "4,500원", 설명: "산미가 적은 고소한 원두", 대표: false, 시그니처: false, 품절: 0 },
           │            │                  │                 │                              │
           │            │                  │                 │                              │       │             └ 품절 표시 (0=판매중, 1=오늘 품절)
           │            │                  │                 │                              │       └ 시그니처 메뉴 (true=맨 아래 "시그니처 메뉴" 구역에도 모아서 보여줌)
           │            │                  │                 │                              └ 대표 메뉴 (true="대표" 배지가 붙고 카드가 돋보임)
           │            │                  │                 └ 메뉴 아래에 나오는 한 줄 설명
           │            │                  └ 가격 (원 글자까지 직접 적어요)
           │            └ 메뉴 이름
           └ 어느 탭에 들어갈지 (커피 / 논커피 / 디저트)


       ■ 하고 싶은 일별 방법

         [1] 가격만 바꾸고 싶어요
             → 바꿀 메뉴의 줄을 찾아서, 가격: "4,500원" 의 따옴표 안만 고치세요.
               예) 가격: "4,500원"  →  가격: "4,800원"
               (숫자 사이 쉼표와 "원" 글자는 직접 적는 글자라서 빠뜨리지 마세요)

         [2] 메뉴 이름이나 설명을 바꾸고 싶어요
             → 이름: "..." 또는 설명: "..." 의 따옴표 안 글자만 고치세요.

         [3] 새 메뉴를 추가하고 싶어요
             → 같은 종류의 메뉴 줄 하나를 통째로 복사(Ctrl+C)해서,
               바로 아래 줄에 붙여넣기(Ctrl+V) 한 다음 글자만 바꾸세요.
               예) 커피 칸에 "플랫화이트"를 넣고 싶다면, 아메리카노 줄을 복사해서 붙여넣고
                   이름: "플랫화이트", 가격: "5,300원", 설명: "진한 우유 커피" 로 고치면 끝!
             → 화면에는 이 목록에 적은 순서대로 보여요. 원하는 위치에 붙여넣으세요.
             → ⚠ 주의: 붙여넣은 줄이 "맨 마지막 줄"이 되면, 그 위 줄 끝에 쉼표(,)가 있는지
               꼭 확인하세요. 쉼표가 빠지면 메뉴판이 통째로 안 보여요.

         [4] 메뉴를 없애고 싶어요
             → 지울 메뉴의 줄 하나를 통째로 지우세요.
               (잠깐만 숨기고 싶다면 줄 맨 앞에 // 를 붙이세요. 나중에 // 만 지우면 다시 나와요.
                예) // { 종류: "디저트", 이름: "스콘", ... },  )

         [5] "대표" 메뉴 표시를 붙이거나 빼고 싶어요
             → 줄의 대표: false 를 대표: true 로 바꾸면 이름 옆에 "대표" 배지가 붙고
               카드가 살짝 더 돋보여요. (지금은 아인슈페너, 흑임자 라떼에 붙어 있어요)
               다시 빼려면 대표: false 로 되돌리세요. (따옴표 없이 영어 소문자로 적어요)
             → 배지 글자를 바꾸고 싶다면 파일 아래쪽 화면 그리는 부분에서
               textContent = "대표" 라고 적힌 곳(검색: Ctrl+F)의 글자를 고치세요.

         [9] "시그니처 메뉴" 구역에 메뉴를 넣거나 빼고 싶어요
             → 줄의 시그니처: false 를 시그니처: true 로 바꾸면, 메뉴판 맨 아래(영업시간 위)에 있는
               "시그니처 메뉴" 구역에 그 메뉴가 모여서 나와요. (탭과 상관없이 한눈에 보여요)
               다시 빼려면 시그니처: false 로 되돌리세요.
             → "대표"와 "시그니처"는 서로 따로예요. 둘 다 true 로 해도 되고, 하나만 true 로 해도 돼요.
               (지금은 아인슈페너, 흑임자 라떼가 둘 다 true 예요)
             → 시그니처가 하나도 없으면 "시그니처 메뉴" 구역은 화면에 나오지 않아요.
             → 구역 제목 글자를 바꾸고 싶다면 아래쪽 화면 부분(HTML)의 "시그니처 메뉴" 를 고치세요.

         [8] 품절 메뉴를 표시하고 싶어요 (한 글자만 바꾸면 돼요!)
             → 메뉴 줄 맨 끝의 품절: 0 을 품절: 1 로 바꾸세요. 저장(Ctrl+S) 후 새로고침(F5).
                 품절: 0  →  판매 중 (평소 모습)
                 품절: 1  →  카드가 흐려지고, 가격에 줄이 그어지고, "오늘 품절" 표시가 떠요.
             → 다시 판매하려면 품절: 1 을 품절: 0 으로 되돌리세요. 하루 장사가 끝나면 0으로!
             → 품절 메뉴도 목록에서 제자리에 그대로 있어요. (순서가 바뀌지 않아요)
             → 숫자는 "0"과 "1"만 쓰세요. 따옴표는 붙이지 않아요. (대표·시그니처는 true/false, 품절은 0/1 로
               쓰는 방식이 달라요. 한 글자만 바꾸면 되도록 일부러 숫자로 만들었어요.)
             → 새 메뉴를 추가할 때는 복사한 줄에 품절: 0 이 들어 있는지 꼭 확인하세요.
               (빠져 있어도 판매 중으로 보이니 메뉴판이 망가지지는 않아요.)

         [6] 새로운 종류(탭)를 만들고 싶어요 (예: "샌드위치")
             → 1단계: 아래 메뉴 목록에 종류: "샌드위치" 인 메뉴 줄을 추가하세요.
             → 2단계: 그 아래 "탭 순서" 줄에 "샌드위치" 를 추가하세요.
               예) const 종류들 = ["커피", "논커피", "디저트", "샌드위치"];
             → 두 군데의 글자가 한 글자도 다르면 안 돼요. (띄어쓰기도 똑같이!)

         [7] 카페가 아니라 다른 가게로 바꾸고 싶어요
             → 종류 · 이름 · 가격 · 설명을 가게에 맞게 바꾸면 돼요.
               예) 종류: "고기" / 이름: "삼겹살 1인분" / 가격: "15,000원"


       ■ 이런 일이 생겼다면? (문제 해결)
         - 메뉴가 하나도 안 보여요
             → 쉼표(,) · 따옴표(") · 중괄호({ }) 중 하나를 지웠을 가능성이 커요.
               방금 고친 줄을 다시 확인하세요. 모르겠으면 백업 파일로 되돌리세요.
         - 탭을 눌렀는데 메뉴가 비어 있어요
             → 메뉴의 종류: "..." 글자와 아래 "탭 순서"의 글자가 다른 거예요. 똑같이 맞추세요.
         - 가격 옆에 "원"이 안 나와요
             → 가격: "4,500" 처럼 "원" 글자를 빼먹은 거예요. "4,500원" 으로 적으세요.
         - 품절: 1 로 바꿨는데 변화가 없어요
             → 저장(Ctrl+S)을 했는지, 새로고침(F5)을 했는지 확인하세요. 숫자 1에 따옴표가 붙어 있어도
               안 돼요. (품절: "1" 이 아니라 품절: 1)
    */

    const 메뉴들 = [

      // ================= 커피 =================
      { 종류: "커피", 이름: "아메리카노", 가격: "4,500원", 설명: "산미가 적은 고소한 원두", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "커피", 이름: "카페라떼", 가격: "5,000원", 설명: "부드러운 우유 거품", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "커피", 이름: "바닐라 라떼", 가격: "5,500원", 설명: "바닐라빈을 직접 우려낸 시럽", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "커피", 이름: "아인슈페너", 가격: "5,800원", 설명: "단맛을 줄인 수제 크림", 대표: true, 시그니처: true, 품절: 0 },
      { 종류: "커피", 이름: "콜드브루", 가격: "5,300원", 설명: "12시간 저온 추출, 목넘김이 깔끔함", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "커피", 이름: "디카페인 아메리카노", 가격: "5,000원", 설명: "카페인 걱정 없이 편하게", 대표: false, 시그니처: false, 품절: 0 },
      // ↑ 커피 메뉴를 더 넣고 싶다면 바로 위 줄을 복사해서 이 자리에 붙여넣으세요.

      // ================= 논커피 =================
      { 종류: "논커피", 이름: "흑임자 라떼", 가격: "5,500원", 설명: "국산 흑임자를 직접 갈아 넣음", 대표: true, 시그니처: true, 품절: 0 },
      { 종류: "논커피", 이름: "말차 라떼", 가격: "5,800원", 설명: "우지 말차, 쌉싸한 맛이 진함", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "논커피", 이름: "쑥 라떼", 가격: "5,500원", 설명: "강화도 쑥, 은은하고 담백함", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "논커피", 이름: "곡물 라떼", 가격: "5,300원", 설명: "볶은 곡물의 구수한 맛", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "논커피", 이름: "자몽에이드", 가격: "6,000원", 설명: "생과일 자몽 과육을 그대로", 대표: false, 시그니처: false, 품절: 0 },
      // ↑ 논커피 메뉴를 더 넣고 싶다면 바로 위 줄을 복사해서 이 자리에 붙여넣으세요.

      // ================= 디저트 =================
      { 종류: "디저트", 이름: "치즈케이크", 가격: "6,500원", 설명: "굽지 않은 부드러운 식감", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "디저트", 이름: "당근케이크", 가격: "6,000원", 설명: "견과류를 넉넉히 넣음", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "디저트", 이름: "스콘", 가격: "4,000원", 설명: "겉은 바삭 속은 촉촉, 잼과 함께", 대표: false, 시그니처: false, 품절: 0 },
      { 종류: "디저트", 이름: "바스크 치즈케이크", 가격: "6,800원", 설명: "겉면을 진하게 태운 풍미", 대표: false, 시그니처: false, 품절: 0 }
      // ↑ 이 줄이 "맨 마지막 메뉴"라서 끝에 쉼표가 없어요.
      //   디저트를 더 추가할 땐: ① 이 줄 끝에 쉼표(,)를 붙이고 ② 아래에 새 줄을 넣고
      //   ③ 새로 넣은 줄이 맨 마지막이면 그 줄 끝에는 쉼표를 붙이지 마세요.
    ];

    /* ----------------------------------------------------------------
       탭 순서 (화면 위쪽 "커피 / 논커피 / 디저트" 버튼이 나오는 순서)
       - 위 메뉴 목록의 종류: "..." 글자와 한 글자도 다르지 않게 적어야 해요.
       - 순서를 바꾸고 싶으면 글자 순서를 바꾸세요. 예) ["디저트", "커피", "논커피"]
       - 맨 앞에 적은 종류가 처음 열릴 때 보이는 탭이에요.
       ---------------------------------------------------------------- */
    const 종류들 = ["커피", "논커피", "디저트"];
  </script>

  <style>
    /* ============================================================
       [색깔 바꾸는 곳] 아래 # 숫자만 바꾸면 전체 색이 바뀝니다.
       ============================================================ */
    :root {
      --갈색: #4A3728;   /* 배경, 제목 색 */
      --크림: #F5EFE6;   /* 카드, 본문 색 */
      --연갈색: #6a4f3a; /* 보조 글씨 색 (카드 위 설명 글자) */
      --강조: #b8793a;   /* '대표' 표시, 포인트 색 */
      --가격색: #6b3a0c; /* 가격 글자 색 (진한 갈색) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* 글꼴: 고운 돋움을 먼저 쓰고, 없으면 맑은 고딕을 씁니다 */
      font-family: "고운 돋움", "GowunDodum", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
      /* 배경: 짙은 갈색에서 더 깊은 갈색으로 은은하게 번지는 그라데이션 */
      background: linear-gradient(160deg, #5a4331 0%, var(--갈색) 45%, #33261b 100%);
      background-attachment: fixed;
      color: var(--크림);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    /* 배경에 은은한 빛 번짐 (유리 효과가 잘 보이도록) */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    body::before { width: 300px; height: 300px; background: #a8703f; top: -80px; right: -100px; opacity: .55; }
    body::after  { width: 340px; height: 340px; background: #7a5237; bottom: 60px; left: -140px; opacity: .6; }

    /* 화면 폭: 휴대폰(390px) 기준 */
    .화면 {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    /* ---------- 1. 맨 위: 가게 이름과 소개 ---------- */
    header { text-align: center; padding: 20px 0 34px; }
    header .위치 { font-size: 14px; opacity: .8; letter-spacing: 1px; }
    header h1 { font-size: 38px; margin: 10px 0 12px; letter-spacing: 2px; }
    header .소개 { font-size: 17px; opacity: .92; }

    /* ---------- 글래스(유리) 카드 공통 ---------- */
    .유리 {
      /* 밝은 유리: 크림색이 비치는 반투명 + 위쪽 빛 반사 */
      background: linear-gradient(160deg, rgba(255, 252, 247, 0.82), rgba(245, 239, 230, 0.68));
      color: var(--갈색);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 10px 32px rgba(20, 12, 6, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    /* ---------- 종류 탭 ---------- */
    /* 위로 스크롤해도 탭이 화면 위에 붙어 있어서, 아래에서도 바로 종류를 바꿀 수 있어요 */
    .탭줄 {
      display: flex; gap: 10px; margin-bottom: 22px;
      position: sticky; top: 0; z-index: 10;
      padding: 10px 0;
      margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px;
    }
    /* 탭이 화면 위에 붙어 있을 때만 뒷배경을 깔아줘서, 지나가는 카드가 비쳐 보이지 않게 해요 */
    .탭줄.붙음 {
      background: linear-gradient(to bottom, rgba(74, 55, 40, 0.95) 75%, rgba(74, 55, 40, 0));
    }
    .탭 {
      flex: 1;
      min-height: 52px;
      padding: 12px 0;
      font-family: inherit;
      font-size: 17px;
      color: var(--크림);
      background: rgba(245, 239, 230, 0.14);
      border: 1px solid rgba(245, 239, 230, 0.35);
      border-radius: 999px;
      cursor: pointer;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      -webkit-tap-highlight-color: transparent;
    }
    .탭.선택됨 {
      background: var(--크림);
      color: var(--갈색);
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    /* ---------- 2. 가운데: 메뉴 카드 ---------- */
    .메뉴카드 { padding: 22px 22px; margin-bottom: 16px; }
    .메뉴윗줄 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    /* 좁은 화면에서 글자가 단어 중간에서 끊기지 않게 (keep-all), 너무 긴 글자는 줄바꿈 */
    .메뉴이름 { font-size: 19px; font-weight: bold; word-break: keep-all; overflow-wrap: break-word; min-width: 0; }
    .대표표시 {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: normal;
      color: #fff;
      background: var(--강조);
      border-radius: 999px;
      vertical-align: middle;
    }
    /* 가격: 크고 진하게 */
    .가격 { font-size: 21px; font-weight: 800; color: var(--가격색); white-space: nowrap; }
    .설명 { margin-top: 6px; font-size: 15px; color: var(--연갈색); word-break: keep-all; overflow-wrap: break-word; }

    /* ---------- 대표 메뉴 카드: 살짝 더 돋보이게 ---------- */
    .유리.추천 {
      background: linear-gradient(160deg, rgba(255, 253, 249, 0.92), rgba(250, 242, 229, 0.8));
      border: 1.5px solid rgba(201, 150, 80, 0.75);
      box-shadow: 0 12px 34px rgba(20, 12, 6, 0.34), 0 0 0 4px rgba(201, 150, 80, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    /* ---------- 시그니처 메뉴 구역 (메뉴 목록 아래) ---------- */
    .시그니처구역 { margin-top: 36px; }
    .시그니처구역[hidden] { display: none; }
    .구역제목 { font-size: 20px; text-align: center; margin-bottom: 18px; letter-spacing: 1px; }
    .구역제목::before, .구역제목::after { content: "—"; opacity: .5; margin: 0 10px; }

    /* ---------- 오늘 품절 카드: 흐리게 ---------- */
    .유리.품절 { opacity: .55; filter: grayscale(.4); box-shadow: 0 4px 12px rgba(20, 12, 6, 0.2); }
    .유리.품절 .가격 { text-decoration: line-through; }
    .품절표시 {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      background: #8c3b2e;
      border-radius: 999px;
      vertical-align: middle;
    }

    /* ---------- 3. 맨 아래: 영업시간과 전화 ---------- */
    footer { margin-top: 32px; padding: 26px 22px; }
    footer h2 { font-size: 18px; margin-bottom: 12px; }
    footer .줄 { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; padding: 6px 0; }
    footer .줄 span:first-child { color: var(--연갈색); }
    footer .줄 span:last-child { text-align: right; }
    footer .구분선 { border: none; border-top: 1px solid rgba(74, 55, 40, 0.18); margin: 16px 0; }

    .전화버튼 {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      margin-top: 22px;
      padding: 16px 0;
      text-align: center;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      color: var(--크림);
      background: var(--갈색);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(74, 55, 40, 0.45);
      -webkit-tap-highlight-color: transparent;
    }
    .전화버튼:active { transform: scale(0.98); }

    /* 인스타 링크도 손가락으로 누르기 편하게 높이를 충분히 */
    footer a.인스타 { color: var(--갈색); display: inline-flex; align-items: center; min-height: 44px; }

    /* 아주 작은 휴대폰(가로 340px 이하)에서는 여백과 글자를 조금 줄여요 */
    @media (max-width: 340px) {
      .화면 { padding-left: 14px; padding-right: 14px; }
      .탭줄 { margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px; }
      .메뉴카드 { padding: 18px 16px; }
      .탭 { font-size: 15px; }
      header h1 { font-size: 32px; }
    }

    /* 휴대폰을 가로로 눕혔을 때(세로 높이가 낮을 때): 탭을 고정하지 않고 여백을 줄여요 */
    @media (max-height: 500px) {
      .탭줄 { position: static; background: none; }
      .화면 { padding-top: 20px; }
      header { padding: 8px 0 18px; }
    }
  </style>
</head>
<body>
  <div class="화면">

    <!-- ===== 1. 맨 위: 가게 이름과 소개 ===== -->
    <!-- [고치는 곳] 가게 이름, 위치, 한 줄 소개를 바꾸려면 아래 글자만 고치세요 -->
    <header>
      <div class="위치">광주 북구 비엔날레</div>
      <h1>브릿지 커피</h1>
      <div class="소개">매일 직접 볶는 스페셜티 커피</div>
    </header>

    <!-- ===== 2. 가운데: 메뉴 목록 ===== -->
    <div class="탭줄" id="탭줄"></div>
    <main id="메뉴목록"></main>

    <!-- ===== 2-2. 메뉴 목록 아래: 시그니처 메뉴 구역 ===== -->
    <!-- [고치는 곳] 제목 글자는 아래 h2 안의 "시그니처 메뉴" 를 고치세요.
         어떤 메뉴가 들어갈지는 맨 위 메뉴 정보에서 시그니처: true 로 정해요. -->
    <section class="시그니처구역" id="시그니처구역" hidden>
      <h2 class="구역제목">시그니처 메뉴</h2>
      <div id="시그니처목록"></div>
    </section>

    <!-- ===== 3. 맨 아래: 영업시간과 전화 걸기 ===== -->
    <!-- [고치는 곳] 영업시간, 주차, 인스타, 전화번호를 바꾸려면 아래 글자를 고치세요 -->
    <footer class="유리">
      <h2>영업시간</h2>
      <div class="줄"><span>평일</span><span>08:00 ~ 21:00</span></div>
      <div class="줄"><span>주말</span><span>10:00 ~ 20:00</span></div>
      <div class="줄"><span>휴무</span><span>목요일</span></div>
      <hr class="구분선">
      <div class="줄"><span>주차</span><span>2대 가능</span></div>
      <div class="줄"><span>좌석</span><span>1인 좌석 6석</span></div>
      <div class="줄"><span>인스타</span><span><a class="인스타" href="https://instagram.com/bridge_coffee">@bridge_coffee</a></span></div>

      <!-- 전화번호를 바꾸려면 아래 tel: 뒤의 숫자(하이픈 없이)와 버튼 글자를 둘 다 고치세요 -->
      <a class="전화버튼" href="tel:0620000000">전화 걸기 062-000-0000</a>
    </footer>

  </div>

  <script>
    /* 메뉴 정보(메뉴들, 종류들)는 파일 맨 위쪽 "★ 메뉴 정보는 전부 여기 한곳에 모여 있습니다 ★" 칸에 있습니다. 메뉴를 고칠 땐 거기로 가세요. */

    /* ===== 아래는 화면을 그려주는 부분입니다. 보통은 고치지 않아도 됩니다. ===== */
    const 탭줄 = document.getElementById("탭줄");
    const 메뉴목록 = document.getElementById("메뉴목록");

    /* 메뉴 하나를 카드로 만들어 주는 부분 (메뉴 목록과 시그니처 구역이 함께 씁니다) */
    function 카드만들기(m) {
        const 카드 = document.createElement("div");
        카드.className = "메뉴카드 유리" + (m.대표 ? " 추천" : "") + (m.품절 === 1 ? " 품절" : "");

        const 윗줄 = document.createElement("div");
        윗줄.className = "메뉴윗줄";

        const 이름 = document.createElement("div");
        이름.className = "메뉴이름";
        이름.textContent = m.이름;
        if (m.대표) {
          const 표시 = document.createElement("span");
          표시.className = "대표표시";
          표시.textContent = "대표";
          이름.appendChild(표시);
        }
        if (m.품절 === 1) {
          const 품절 = document.createElement("span");
          품절.className = "품절표시";
          품절.textContent = "오늘 품절";
          이름.appendChild(품절);
        }

        const 가격 = document.createElement("div");
        가격.className = "가격";
        가격.textContent = m.가격;

        윗줄.appendChild(이름);
        윗줄.appendChild(가격);

        const 설명 = document.createElement("div");
        설명.className = "설명";
        설명.textContent = m.설명;

        카드.appendChild(윗줄);
        카드.appendChild(설명);
        return 카드;
    }

    function 메뉴그리기(종류) {
      메뉴목록.innerHTML = "";
      메뉴들.filter(m => m.종류 === 종류).forEach(m => 메뉴목록.appendChild(카드만들기(m)));
    }

    /* 시그니처: true 인 메뉴를 모아서 맨 아래 구역에 보여줍니다 (하나도 없으면 구역을 숨김) */
    function 시그니처그리기() {
      const 모음 = 메뉴들.filter(m => m.시그니처);
      const 구역 = document.getElementById("시그니처구역");
      const 목록 = document.getElementById("시그니처목록");
      목록.innerHTML = "";
      모음.forEach(m => 목록.appendChild(카드만들기(m)));
      구역.hidden = 모음.length === 0;
    }

    function 탭만들기() {
      종류들.forEach((종류, 번호) => {
        const 버튼 = document.createElement("button");
        버튼.className = "탭" + (번호 === 0 ? " 선택됨" : "");
        버튼.textContent = 종류;
        버튼.addEventListener("click", () => {
          document.querySelectorAll(".탭").forEach(t => t.classList.remove("선택됨"));
          버튼.classList.add("선택됨");
          메뉴그리기(종류);
        });
        탭줄.appendChild(버튼);
      });
    }

    /* 탭이 화면 맨 위에 붙었는지 살펴서 "붙음" 표시를 켜고 끕니다 */
    function 탭붙음확인() {
      탭줄.classList.toggle("붙음", window.scrollY > 탭줄.offsetTop - 1);
    }
    window.addEventListener("scroll", 탭붙음확인, { passive: true });

    탭만들기();
    메뉴그리기(종류들[0]);
    시그니처그리기();
  </script>
</body>
</html>
